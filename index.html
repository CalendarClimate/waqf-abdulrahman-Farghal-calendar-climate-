<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box}
body{background:#08140f;margin:0;padding:12px;font-family:Amiri,'Traditional Arabic',serif;display:flex;flex-direction:column;align-items:center}
.top{background:#fff8e1;border:3px solid #b8964f;border-radius:16px;padding:14px;width:850px;max-width:96vw;text-align:center}
.top label{font-weight:bold;color:#5a4010;font-size:18px;display:block;margin-bottom:8px}
.top input{font-size:30px;font-weight:bold;width:180px;text-align:center;padding:10px;border:3px solid #8a6d2a;border-radius:10px}
.btn{background:#0f2a1a;color:#f0d27a;border:2px solid #c9a86a;padding:10px 22px;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px}
.poster{margin-top:14px;width:850px;max-width:96vw;background:#0e2518;border:10px double #c9a86a;outline:3px solid #7a5d2e;outline-offset:-10px;padding:24px 18px;color:#e8d9a5}
.aya{text-align:center;font-size:28px;color:#f3d989;font-weight:bold}
.aya small{display:block;font-size:15px;color:#c9b896}
.note{border:1px solid #c9a86a;padding:8px;margin:12px 0;text-align:center;font-size:10.5px;color:#d1c29a;background:rgba(0,0,0,.3)}
.title{text-align:center;font-size:50px;color:#f0d27a;margin:10px 0 0;font-weight:bold}
.sub{text-align:center;font-size:10px;color:#a99a7a;margin-bottom:12px}
.today{border:2px solid #c9a86a;border-radius:12px;padding:14px;text-align:center;font-weight:bold;line-height:2;background:rgba(201,168,106,.18);color:#fff;font-size:15px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;border:2px solid #c9a86a;font-size:12.5px}
th{background:#c9a86a;color:#1a2a12;padding:9px 4px;border:1px solid #7a5d2e;font-size:13px}
td{border:1px solid #5a4a2a;padding:8px 5px;text-align:center;color:#e0d0a0}
tr:nth-child(even) td{background:rgba(0,0,0,.25)}
@media print{.top{display:none}}
</style>
</head>
<body>
