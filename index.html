<!DOCTYPE html>
<html lang='ar' dir='rtl'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>تقويم ومناخ عبدالرحمن فرغل - وقف لله تعالى</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700&display=swap');
body{font-family:'Tajawal',sans-serif;background:#f4f7f4;margin:0;padding:12px}
.header{background:linear-gradient(135deg,#0a4d2a,#148241);color:#fff;text-align:center;padding:22px;border-radius:16px}
.header h1{margin:0;font-size:28px}
.header div{margin-top:6px;opacity:0.9}
.input-box{background:#fff;padding:16px;border-radius:12px;margin:18px auto;max-width:480px;text-align:center;border:2px solid #148241;box-shadow:0 4px 10px rgba(0,0,0,0.08)}
.input-box label{font-weight:800;font-size:19px;color:#0a4d2a;display:block;margin-bottom:8px}
.input-box input{font-size:26px;width:130px;text-align:center;padding:8px;border:2px solid #148241;border-radius:8px;font-weight:800;color:#0a4d2a}
.calendar{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:15px}
.month{background:#fff;border-radius:10px;overflow:hidden;border-top:4px solid #148241;box-shadow:0 3px 8px rgba(0,0,0,0.05)}
.month-header{background:#e8f5e9;text-align:center;padding:8px;font-weight:800;color:#0a4d2a}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f1f8e9;padding:5px}
td{padding:5px;text-align:center;border:1px solid #eee;height:48px;vertical-align:top}
.greg{font-weight:700;font-size:14px;display:block}
.hijri{font-size:11px;color:#148241;display:block;margin-top:2px;font-weight:600}
</style>
</head>
<body>
<div class='header'>
<h1>تقويم ومناخ عبدالرحمن فرغل</h1>
<div>وقف لله تعالى - صدقة جارية</div>
<div style="font-size:13px">التقويم الهجري والميلادي والمناخ - المدينة المنورة</div>
</div>

<div class='input-box'>
<label>📅 ادخل السنة المطلوب عرضها</label>
<input type='number' id='y' value='2027' min='1900' max='2100' oninput='gen()'>
<div id='hy' style='margin-top:10px;font-size:14px;color:#555'></div>
</div>

<div class='calendar' id='cal'></div>

<script>
const gM=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function hijri(d){
  try{
    return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long'}).format(d);
  }catch(e){
    return new Intl.DateTimeFormat('ar-SA-u-ca-islamic',{day:'numeric',month:'short'}).format(d);
  }
}
function gen(){
  let year=parseInt(document.getElementById('y').value)||2027;
  let cal=document.getElementById('cal'); cal.innerHTML='';
  for(let m=0;m<12;m++){
    let first=new Date(year,m,1);
    let days=new Date(year,m+1,0).getDate();
    let start=(first.getDay()+6)%7;
    let h=`<div class='month'><div class='month-header'>${gM[m]} ${year}</div><table><tr><th>ن</th><th>ث</th><th>ر</th><th>خ</th><th>ج</th><th>س</th><th>ح</th></tr><tr>`;
    for(let i=0;i<start;i++) h+='<td></td>';
    for(let d=1;d<=days;d++){
      let cur=new Date(year,m,d);
      if((start+d-1)%7==0&&d!=1) h+='</tr><tr>';
      h+=`<td><span class='greg'>${d}</span><span class='hijri'>${hijri(cur)}</span></td>`;
    }
    h+='</tr></table></div>';
    cal.innerHTML+=h;
  }
  let hjYear='';
  try{
    hjYear=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{year:'numeric'}).format(new Date(year,0,1));
  }catch(e){hjYear='';}
  document.getElementById('hy').innerHTML=`عرض السنة: <b>${year} ميلادي</b> - <b>${hjYear} هجري</b>`;
}
gen();
</script>
</body>
</html>
